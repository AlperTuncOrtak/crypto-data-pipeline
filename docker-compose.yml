version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crypto_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-12345678}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-crypto_analysis}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: crypto_api
    restart: always
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_NAME=crypto_analysis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mysql
      - redis

  ws_worker:
    build: .
    container_name: crypto_ws_worker
    restart: always
    command: python src/multi_exchange_ws.py
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_NAME=crypto_analysis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mysql
      - redis

  catalog_worker:
    build: .
    container_name: crypto_catalog_worker
    restart: always
    command: python src/catalog_sync.py
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_NAME=crypto_analysis
      - REDIS_URL=redis://redis:6379/0
      - DAEMON_MODE=1
      - CATALOG_SYNC_INTERVAL=21600
    depends_on:
      - mysql

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
